<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notepad</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: #f0f0f0; color: #000;
    font-family: "Segoe UI", Tahoma, sans-serif; font-size: 13px;
  }
  .titlebar { height: 9px; background: #d9e3f0; flex: 0 0 auto; }
  nav { display: flex; gap: 4px; padding: 3px 4px; position: relative; z-index: 20; flex: 0 0 auto; }
  nav > div { position: relative; }
  nav button.top { background: none; border: 0; font: inherit; padding: 2px 9px; cursor: default; }
  nav button.top:hover, nav button.top.open { background: #cfe3fa; }
  nav button.top span { text-decoration: underline; }
  ul.menu {
    position: absolute; left: 0; top: 100%; min-width: 180px; margin: 0;
    padding: 2px 0; list-style: none; background: #f0f0f0; border: 1px solid #a0a0a0;
    box-shadow: 2px 2px 3px rgba(0,0,0,.25);
  }
  ul.menu button {
    display: flex; justify-content: space-between; gap: 24px; width: 100%;
    background: none; border: 0; font: inherit; text-align: left;
    padding: 3px 18px; white-space: nowrap; cursor: default;
  }
  ul.menu button:hover { background: #cfe3fa; }
  ul.menu button .sc { color: #666; }
  li.sep { border-top: 1px solid #a0a0a0; margin: 3px 0; }
  .editor { flex: 1 1 auto; min-height: 0; border: 1px solid #a0a0a0; background: #fff; }
  textarea {
    width: 100%; height: 100%; resize: none; border: 0; outline: none;
    padding: 2px 3px; font-family: Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 15px; background: #fff; color: #000;
  }
  .status { flex: 0 0 auto; border-top: 1px solid #a0a0a0; padding: 3px 6px; }
</style>
</head>
<body>
<div class="titlebar"></div>
<nav id="nav"></nav>
<input id="file" type="file" accept=".txt,text/*" style="display:none" />
<div class="editor"><textarea id="ta" aria-label="Text editor" spellcheck="false"></textarea></div>
<div class="status" id="status">Ln 1, Col 1</div>
<script>
(function () {
  var ta = document.getElementById('ta');
  var status = document.getElementById('status');
  var nav = document.getElementById('nav');
  var fileInput = document.getElementById('file');
  var wrap = true, showStatus = true, lastFind = '', openMenu = null;

  function updatePos() {
    var upto = ta.value.slice(0, ta.selectionStart).split('\n');
    status.textContent = 'Ln ' + upto.length + ', Col ' + (upto[upto.length - 1].length + 1);
  }
  ['keyup', 'click', 'select', 'input'].forEach(function (e) { ta.addEventListener(e, updatePos); });

  function insert(v) {
    var s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + v + ta.value.slice(e);
    ta.focus(); ta.setSelectionRange(s + v.length, s + v.length); updatePos();
  }
  function find(q, from) {
    if (!q) return; lastFind = q;
    var i = ta.value.toLowerCase().indexOf(q.toLowerCase(), from);
    if (i === -1) { alert('Cannot find "' + q + '"'); return; }
    ta.focus(); ta.setSelectionRange(i, i + q.length); updatePos();
  }
  function save() {
    var blob = new Blob([ta.value], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Untitled.txt'; a.click();
    URL.revokeObjectURL(url);
  }
  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    if (f) { var r = new FileReader(); r.onload = function () { ta.value = r.result; updatePos(); }; r.readAsText(f); }
    fileInput.value = '';
  });

  function menus() {
    return [
      { label: 'File', items: [
        { label: 'New', sc: 'Ctrl+N', run: function () { ta.value = ''; updatePos(); } },
        { label: 'Open...', sc: 'Ctrl+O', run: function () { fileInput.click(); } },
        { label: 'Save', sc: 'Ctrl+S', run: save },
        { label: 'Save As...', run: save },
        'sep',
        { label: 'Exit', run: function () { window.close(); } }
      ]},
      { label: 'Edit', items: [
        { label: 'Undo', sc: 'Ctrl+Z', run: function () { document.execCommand('undo'); } },
        'sep',
        { label: 'Cut', sc: 'Ctrl+X', run: function () { document.execCommand('cut'); } },
        { label: 'Copy', sc: 'Ctrl+C', run: function () { document.execCommand('copy'); } },
        { label: 'Paste', sc: 'Ctrl+V', run: function () { ta.focus(); } },
        { label: 'Delete', sc: 'Del', run: function () { insert(''); } },
        'sep',
        { label: 'Select All', sc: 'Ctrl+A', run: function () { ta.focus(); ta.select(); } },
        { label: 'Time/Date', sc: 'F5', run: function () { insert(new Date().toLocaleString()); } }
      ]},
      { label: 'Search', items: [
        { label: 'Find...', sc: 'Ctrl+F', run: function () { var q = prompt('Find what:', lastFind); if (q) find(q, 0); } },
        { label: 'Find Next', sc: 'F3', run: function () { find(lastFind, ta.selectionEnd); } }
      ]},
      { label: 'View', items: [
        { label: (wrap ? '\u2713 ' : '') + 'Word Wrap', run: function () { wrap = !wrap; ta.wrap = wrap ? 'soft' : 'off'; } },
        { label: (showStatus ? '\u2713 ' : '') + 'Status Bar', run: function () { showStatus = !showStatus; status.style.display = showStatus ? '' : 'none'; } }
      ]},
      { label: 'Help', items: [
        { label: 'Made by Conner Wiebe', run: function () { alert('Made by Conner Wiebe'); } },
        'sep',
        { label: 'About Notepad', run: function () { alert('Notepad\nA classic plain text editor.\nMade by Conner Wiebe.'); } }
      ]}
    ];
  }

  function render() {
    nav.innerHTML = '';
    menus().forEach(function (m) {
      var wrapEl = document.createElement('div');
      var btn = document.createElement('button');
      btn.className = 'top' + (openMenu === m.label ? ' open' : '');
      btn.innerHTML = '<span>' + m.label[0] + '</span>' + m.label.slice(1);
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        openMenu = openMenu === m.label ? null : m.label;
        render();
      });
      btn.addEventListener('mouseenter', function () { if (openMenu) { openMenu = m.label; render(); } });
      wrapEl.appendChild(btn);
      if (openMenu === m.label) {
        var ul = document.createElement('ul');
        ul.className = 'menu';
        ul.addEventListener('click', function (ev) { ev.stopPropagation(); });
        m.items.forEach(function (it) {
          var li = document.createElement('li');
          if (it === 'sep') { li.className = 'sep'; }
          else {
            var b = document.createElement('button');
            b.innerHTML = '<span></span><span class="sc"></span>';
            b.firstChild.textContent = it.label;
            b.lastChild.textContent = it.sc || '';
            b.addEventListener('click', function () { openMenu = null; render(); it.run(); });
            li.appendChild(b);
          }
          ul.appendChild(li);
        });
        wrapEl.appendChild(ul);
      }
      nav.appendChild(wrapEl);
    });
  }
  window.addEventListener('click', function () { if (openMenu) { openMenu = null; render(); } });
  render();
  ta.focus();
})();
</script>
</body>
</html>
